<ng-template #modal>
  <div class="modal-body">
    <div class="d-flex justify-content-end">
      <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide()">
        <span aria-hidden="true" class="visually-hidden">&times;</span>
      </button>
    </div>
    <div class="col">
      <div class="row text-center">
        <fa-icon [icon]="faQ" class="quizlet-logo quizlet-color"></fa-icon>
        <div class="fs-3 mb-2">
          Exporter un set vers Quizlet
          <a href="/handbook/usage/creating-sets#importing-from-quizlet" target="_blank" class="text-decoration-none help-button"><fa-icon [icon]="faQuestionCircle" class="fs-5"></fa-icon></a>
        </div>
        <div class="fs-6 text-secondary">Les sets peuvent être importés dans Quizlet. Cliquez <a href="/handbook/usage/sets/exporting-sets/#exporting-to-quizlet" target="_blank">ici</a> pour plus d'informations sur comment procéder.</div>
      </div>
    </div>
    <hr>
    <form class="mt-3" (ngSubmit)="submit(form)" #form="ngForm" ngNativeValidate>
      <div class="mb-3">
        <input class="form-control" name="sideDiscriminator" placeholder="Tapez votre discriminant côté..." type="text" [disabled]="clicked && !error" ngModel required>
      </div>
      <div class="mb-3">
        <input class="form-control" name="cardDiscriminator" placeholder="Tapez votre discriminant de carte..." type="text" [disabled]="clicked && !error" ngModel required>
      </div>
      <div *ngIf="error" class="alert alert-danger" role="alert">
        Une erreur est survenue lors de l'exportation de votre set. L'un de vos discriminants contient-il des caractères présents dans votre set ?
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary" [disabled]="clicked && !error">
          <span *ngIf="clicked && !error" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          Exporter
        </button>
      </div>
    </form>
  </div>
</ng-template>
