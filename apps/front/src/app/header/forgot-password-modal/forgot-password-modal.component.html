<ng-template #modal>
  <div class="modal-header bg-white">
    <h4 class="modal-title pull-left">Mot de passe oublié</h4>
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide(); !this.publicAppEnv && onLandingPage ? modalService.modal.next('login-open') : null">
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <form class="mx-3" (ngSubmit)="submit(forgotForm)" #forgotForm="ngForm" ngNativeValidate>
      <div class="form-text mb-3">Entrez votre adresse email pour recevoir un lien de réinitialisation du mot de passe</div>
      <div class="mb-3">
        <label for="forgot-email" class="form-label">Adresse email</label>
        <input [disabled]="clicked" type="email" class="form-control" id="forgot-email" name="email" ngModel required>
        <div *ngIf="response === ApiResponseOptions.Success" class="form-text text-success">Si cet email existe, nous avons envoyé un message de réinitialisation.</div>
        <div *ngIf="response === ApiResponseOptions.Fail" class="form-text text-danger">Une erreur est survenue.</div>
        <div *ngIf="response === ApiResponseOptions.Ratelimit" class="form-text text-danger">Vous effectuez trop de requêtes. Veuillez réessayer plus tard.</div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary" [disabled]="clicked">Envoyer la réinitialisation du mot de passe</button>
      </div>
    </form>
  </div>
</ng-template>
